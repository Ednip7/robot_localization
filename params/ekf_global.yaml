ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    print_diagnostics: false
    debug: false
    debug_out_file: /home/inaut/Tesis-nico/rat_robot/rat_ws/robot_localization_global_debug.txt

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map   # <- IMPORTANTE: en global siempre usamos map

    # Odometry local (ya fusionada por el ekf_local)
    odom0: /odometry/filtered
    odom0_config: [false, false, false,   # x, y, z
                   false, false, false,  # roll, pitch, yaw
                   false, false, false,   # vx, vy, vz
                   false, false, false,  # vroll, vpitch, vyaw
                   false, false, false] # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 1.0
    odom0_nodelay: true

    # GPS (convertido a odometry por navsat_transform)
    odom1: /odometry/gps
    odom1_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10
    odom1_pose_rejection_threshold: 2.0
    odom1_twist_rejection_threshold: 0.2
    odom1_nodelay: true

    # Opcional: IMU
    imu0: /olive/imu/id001/ahrs
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_pose_rejection_threshold: 2.0                 # Note the difference in parameter names
    imu0_twist_rejection_threshold: 2.0                #
    imu0_linear_acceleration_rejection_threshold: 0.8 

    twist0: /velocidad_robot
    twist0_config: [false, false, false,
                    false, false, false,
                    true,  false,  false,
                    false, false, true,
                    false, false, false]
    twist0_queue_size: 20
    twist0_rejection_threshold: 2.0
    twist0_nodelay: true

    # Output
    publish_tf: true
    publish_acceleration: false

