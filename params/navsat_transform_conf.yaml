navsat_transform_node:
    ros__parameters:
        frequency: 50.0
        delay: 0.0
        magnetic_declination_radians: 0.0  # Ajustar según tu ubicación
        yaw_offset: 0.0
        zero_altitude: false
        broadcast_utm_transform: true
        publish_filtered_gps: true
        use_odometry_yaw: true  # Usar el yaw del filtro local
        wait_for_datum: false